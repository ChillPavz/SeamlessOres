plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}
base {
    // mod_id, not mod_name: mod_name puts spaces in the jar filename.
    archivesName = "${mod_id}-forge-${minecraft_version}"
}
// The template's mixin plugin, config() calls and MixinConfigs manifest entry are removed: this mod
// has no mixins, and naming configs that do not exist makes Forge abort at startup.

processResources {
    // TWO files want to be META-INF/accesstransformer.cfg. common/ ships one in PLAIN member names
    // for Fabric and NeoForge; forge/ ships one in SRG member names, which is what classic Forge
    // takes at compile time and at runtime. Ours must win. Without a strategy Gradle fails the
    // build, which is loud - but the wrong one winning would be silent, so assert the result.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE   // keeps the FIRST copy: this module's own

    doLast {
        def at = new File(destinationDir, 'META-INF/accesstransformer.cfg')
        if (!at.exists() || !at.text.contains('m_247654_')) {
            throw new GradleException("forge: META-INF/accesstransformer.cfg in the jar is not the "
                    + "SRG-named copy from forge/src/main/resources. Access widening will fail "
                    + "silently at runtime. Check the processResources copy order.")
        }
    }
}

// Nothing reads an AT out of a sources jar, so first-wins is fine here and needs no assertion.
tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    copyIdeResources = true //Calls processResources when in dev

    reobf = false // Forge 1.20.6+ uses official mappings at runtime, so we shouldn't reobf from official to SRG

    // Automatically enable forge AccessTransformers if the file exists
    // This location is hardcoded in Forge and can not be changed.
    // https://github.com/MinecraftForge/MinecraftForge/blob/be1698bb1554f9c8fa2f58e32b9ab70bc4385e60/fmlloader/src/main/java/net/minecraftforge/fml/loading/moddiscovery/ModFile.java#L123
    // Forge still uses SRG names during compile time, so we cannot use the common AT's
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        client {
            workingDirectory file('runs/client')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory file('runs/server')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            mods {
                modServerRun {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory file('runs/data')
            ideaModule "${rootProject.name}.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            taskName 'Data'
            mods {
                modDataRun {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    maven { url = 'https://maven.shedaniel.me/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Cloth Config (AutoConfig). Unlike 1.21.11, a Forge build of Cloth exists at this version.
    implementation("me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}")

    // Forge's hack fix
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            fg.component(it)
        }
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}