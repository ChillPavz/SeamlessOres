# Forge needs its OWN copy of the access transformer, and it is NOT a copy of common's.
# TWO reasons, both hardcoded:
#  1. ForgeGradle reads this file only from forge/src/main/resources/META-INF/accesstransformer.cfg
#     and never from common. The path is fixed inside Forge itself.
#  2. Forge applies ATs to the SRG-named jar, so MEMBER names here must be SRG (m_247654_,
#     f_209676_) even though CLASS names are official. NeoForge and Fabric both take plain names,
#     which is why common's copy is unusable here. Plain names fail the compile with
#     "ore is not public in VeinType; cannot be accessed from outside package" - the AT parses
#     without error, it simply matches nothing.
# Recover a SRG name from forge/build/createMcpToSrg/output.tsrg after any Forge build: entries
# read "<official> <srg>", nested under their official class name. Re-derive on every version
# bump - these numbers are not stable across Minecraft versions in general, though 1.21.1 and
# 1.21.11 happen to agree on both of these (checked, not assumed).
# WARNING: a BARE "#" line (a comment with no text after it) is rejected by the AT parser, and the
# whole transform then aborts. The symptom is a completely unrelated-looking Gradle failure,
# "Could not find net.minecraftforge:forge:<ver>_mapped_official_<mc>_at_<hash>", because the
# artifact that error names is the one the failed transform was supposed to produce. Use a blank
# line to separate blocks, never a lone "#".
# Keep the SET of widenings in sync with common/src/main/resources/META-INF/accesstransformer.cfg
# and common/src/main/resources/seamlessores.accesswidener.

# Holder.Reference#bindValue - protected. Needed to swap the value of an already-loaded
# CONFIGURED_FEATURE entry, which is how the ore target injection works; see OreTargetInjector.
public net.minecraft.core.Holder$Reference m_247654_(Ljava/lang/Object;)V # bindValue

# RegistrySetBuilder$LazyHolder is the only subclass that overrides it, and a protected override of
# a public method is illegal - widening only the parent fails the Minecraft recompile.
public net.minecraft.core.RegistrySetBuilder$LazyHolder m_247654_(Ljava/lang/Object;)V # bindValue

# OreVeinifier.VeinType holds the ore block for the large copper/iron veins, which are built during
# NOISE generation rather than by a configured feature - the registry injection cannot reach them.
# See VeinOreInjector. '-f' strips final so the field can be reassigned.
public net.minecraft.world.level.levelgen.OreVeinifier$VeinType
public-f net.minecraft.world.level.levelgen.OreVeinifier$VeinType f_209676_ # ore

# CountPlacement.count - SRG here, plain in common's copy. See CopperDensityInjector.
# f_191624_ verified against forge/build/createMcpToSrg/output.tsrg at this version, not assumed
# (it happens to match 1.20.1, which is luck rather than a rule).
public net.minecraft.world.level.levelgen.placement.CountPlacement f_191624_ # count
