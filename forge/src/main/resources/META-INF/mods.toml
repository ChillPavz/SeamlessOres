modLoader = "javafml" #mandatory
loaderVersion = "${forge_loader_version_range}" #mandatory
license = "${license}"
issueTrackerURL = "https://github.com/chillpavz/seamless-ores/issues"

[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
displayURL = "https://modrinth.com/mod/seamless-ores"
logoFile = "${mod_id}.png" #optional
credits = "${credits}" #optional
authors = "${mod_author}" #optional
description = '''${description}''' #mandatory (Supports multiline text)

# There is deliberately NO cloth_config dependency here. Cloth Config has no Forge build past
# 1.21.3, so this module uses Forge's own ForgeConfigSpec plus a hand-written screen instead.

# NOTE: classic Forge uses `mandatory = true/false` here. `type = "required"` is NeoForge's syntax and
# makes Forge reject the jar outright with "Missing required field mandatory in dependency".
[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
