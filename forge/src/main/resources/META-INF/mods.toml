modLoader = "javafml" #mandatory
loaderVersion = "${forge_loader_version_range}" #mandatory
license = "${license}"
issueTrackerURL = "https://github.com/chillpavz/seamless-ores/issues"

[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
displayURL = "https://modrinth.com/mod/seamless-ores"
logoFile = "${mod_id}.png" #optional
credits = "${credits}" #optional
authors = "${mod_author}" #optional
description = '''${description}''' #mandatory (Supports multiline text)

# NOTE: classic Forge uses `mandatory = true/false` here. `type = "required"` is NeoForge's syntax and
# makes Forge reject the jar outright with "Missing required field mandatory in dependency".
[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Cloth's real mod id is 'cloth_config'; it PROVIDES 'cloth-config2', which is what fabric.mod.json
# uses. Unlike the 1.21.11 branch, cloth HAS a Forge build at this version, so it is a real
# dependency here and the config screen is generated rather than hand written.
[[dependencies.${mod_id}]]
modId = "cloth_config"
mandatory = true
versionRange = "[${cloth_config_version},)"
ordering = "AFTER"
side = "BOTH"
