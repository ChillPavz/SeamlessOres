modLoader = "javafml" #mandatory
loaderVersion = "${forge_loader_version_range}" #mandatory
license = "${license}"
issueTrackerURL = "https://github.com/chillpavz/seamless-ores/issues"

[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
displayURL = "https://modrinth.com/mod/seamless-ores"
logoFile = "${mod_id}.png" #optional
credits = "${credits}" #optional
authors = "${mod_author}" #optional
description = '''${description}''' #mandatory (Supports multiline text)

# NOTE: classic Forge uses `mandatory = true/false` here. `type = "required"` is NeoForge's syntax and
# makes Forge reject the jar outright with "Missing required field mandatory in dependency".
[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Cloth Config. Official cloth ships no Forge build at this Minecraft version, so Forge players need
# the unofficial cloth-config-forge port, which carries the same mod id and the same version number.
# Name it on the store page: the launcher cannot auto install it from this dependency alone, because
# the two are separate projects on Modrinth.
[[dependencies.${mod_id}]]
modId = "cloth_config"
mandatory = true
versionRange = "[${cloth_config_version},)"
ordering = "AFTER"
side = "BOTH"
