# BAND 1.21.4: ONE JAR FOR 1.21.4 THROUGH 1.21.10, Fabric and NeoForge. Compiled against 1.21.4 (the
# oldest in the range) and declared up to 1.21.10. Stops before 1.21.11, which renames
# ResourceLocation to Identifier on the loaders that run on official names (NeoForge/Forge). No
# Forge: classic Forge has a hard binary wall inside this range (eventbus 6 -> 7,
# FMLJavaModLoadingContext -> BusGroup, at 1.21.5/1.21.6), so one Forge jar cannot span it.
# Cloth ships a different MAJOR per Minecraft version across this range (17.x is 1.21.4, 18.x 1.21.5,
# 19.x 1.21.6-8, 20.x 1.21.9-10), so the NeoForge dependency range is permissive upward.
loaders=fabric,neoforge

version=5.0.0
minecraft_version=1.21.4
minecraft_version_range=[1.21.4, 1.21.11)
fabric_minecraft_version_range=>=1.21.4 <1.21.11
neo_form_version=1.21.4-20241203.161809
parchment_minecraft=1.21.4
parchment_version=2024.12.22
fabric_version=0.119.4+1.21.4
fabric_loader_version=0.16.9
cloth_config_version=17.0.144
modmenu_version=13.0.4
neoforge_version=21.4.157
neoforge_loader_version_range=[4,)
neoforge_version_range=[21.4,21.11)
# Forge is not built in this band; these only keep the shared metadata expansion complete.
forge_version=56.0.9
forge_version_range=[56,)
forge_loader_version_range=[56,)
forge_cloth_artifact=maven.modrinth:cloth-config-forge
forge_jopt_simple_fix=false
