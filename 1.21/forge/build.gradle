plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '[6.0.46,6.2)'
    id 'idea'
}
base {
    // The template used mod_name here, which puts spaces in the jar filename; mod_id matches what
    // multiloader-common gives the other modules.
    archivesName = "${mod_id}-forge-${minecraft_version}"
}
// Mixin: common's config (the copper validate() hook and the dripstone shell). Forge loads a mixin
// config only through the MixinConfigs manifest entry. No refmap and no annotation processor: from
// 1.20.6 Forge runs on Mojang names, the names the mixins are written in (no Forge 1.21.x mod in the
// jar library ships a refmap either). The copper pass at server start stays as well; both are
// idempotent against each other.
jar {
    manifest {
        attributes('MixinConfigs': "${mod_id}.mixins.json")
    }
}

processResources {
    // TWO files want to be META-INF/accesstransformer.cfg here. common/ ships one in PLAIN member
    // names, which is what Fabric and NeoForge take; forge/ ships one in SRG member names, which is
    // what classic Forge takes both at compile time and at runtime (verified: Forge's own universal
    // jar ships m_10595_ / f_90817_ style entries). Ours must win. Without a strategy Gradle fails
    // the build outright, which is at least loud - but the wrong one winning would be silent, so
    // the check below asserts the result instead of trusting copy order.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE   // keeps the FIRST copy: this module's own

    doLast {
        def at = new File(destinationDir, 'META-INF/accesstransformer.cfg')
        if (!at.exists() || !at.text.contains('m_247654_')) {
            throw new GradleException("forge: META-INF/accesstransformer.cfg in the jar is not the "
                    + "SRG-named copy from forge/src/<band>/resources. Access widening will fail "
                    + "silently at runtime. Check the processResources copy order.")
        }
    }
}

// sourcesJar pulls in common's resources as well, so it hits the same clash. Nothing reads an AT
// out of a sources jar, so first-wins is fine here and needs no assertion.
tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    copyIdeResources = true //Calls processResources when in dev

    reobf = false // Forge 1.20.6+ uses official mappings at runtime, so we shouldn't reobf from official to SRG

    // Automatically enable forge AccessTransformers if the file exists
    // This location is hardcoded in Forge and can not be changed.
    // https://github.com/MinecraftForge/MinecraftForge/blob/be1698bb1554f9c8fa2f58e32b9ab70bc4385e60/fmlloader/src/main/java/net/minecraftforge/fml/loading/moddiscovery/ModFile.java#L123
    // Forge still uses SRG names during compile time, so we cannot use the common AT's
    def at = bandFile(projectDir, 'resources/META-INF/accesstransformer.cfg')
    if (at != null) {
        accessTransformer = at
    }

    runs {
        client {
            workingDirectory file('runs/client')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory file('runs/server')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            mods {
                modServerRun {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory file('runs/data')
            ideaModule "${rootProject.name}.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            taskName 'Data'
            mods {
                modDataRun {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    // Official Cloth ships Forge builds on shedaniel's maven up to 1.21.3. After that the
    // unofficial cloth-config-forge port is the only one, published on Modrinth's maven: same mod
    // id, 'cloth_config', and the same version number. versions/<band> names the coordinate.
    maven { url = 'https://maven.shedaniel.me/' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup('maven.modrinth') }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Cloth Config (AutoConfig), so all three loaders share one annotated config class.
    implementation("${forge_cloth_artifact}:${cloth_config_version}")

    // Forge's hack fix, needed by the 1.21.1 dev runtime only.
    if (forge_jopt_simple_fix.toBoolean()) {
        implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            fg.component(it)
        }
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'forge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'forge')
            }
        }
    }
}
