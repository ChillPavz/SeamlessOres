# Everything that changes with Minecraft lives in versions/<band>.properties, picked with -Pmc, and
# is deliberately NOT here, so a stale value can never shadow it. See settings.gradle.
# Every field used in a metadata file must also be in the expandProps map in
# buildSrc/src/main/groovy/multiloader-common.gradle, or it expands to nothing.

# Project
group=com.chillpavz.seamlessores
java_version=21

# Common
mod_name=Seamless Ores
mod_author=chillpavz
mod_id=seamlessores
license=PolyForm-Shield-1.0.0
credits=
description=Ore blocks whose background matches the stone they generate in. \nVanilla ore distribution is preserved exactly.

# Cloth Config (config screen), from https://maven.shedaniel.me/
# Mod id is 'cloth_config' and it PROVIDES 'cloth-config2' - so fabric.mod.json depends on
# cloth-config2 while the loader TOMLs depend on cloth_config. Getting that backwards fails to load.
# Mod Menu (Fabric-only config button), from https://maven.terraformersmc.com/

# NeoForge: the range for the 'neoforge' MOD dependency must NOT be "[${neoforge_version},)" -
# NeoForge builds are numbered <mc>.<build>, so pinning to the build we compiled against rejects
# every earlier build of the same Minecraft version.

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
