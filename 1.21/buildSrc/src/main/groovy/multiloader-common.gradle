plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

// ERA SOURCE FOLDERS. What differs between the 1.21.x bands lives in src/<era>/java and
// src/<era>/resources, where <era> names the bands that share those bytes, joined by '+':
// src/1.21.11/ is that band's alone, a src/1.21.1+1.21.11/ would go into both builds. The band
// comes from -Pmc (settings.gradle); a folder that names another band is never compiled.
ext.bandEraDirs = { File moduleDir ->
    (new File(moduleDir, 'src').listFiles() ?: new File[0])
            .findAll { it.isDirectory() && it.name != 'main' && (it.name.split('\\+') as List).contains(mc_band) }
            .sort { it.name }
}
bandEraDirs(projectDir).each { era ->
    sourceSets.main.java.srcDir(new File(era, 'java'))
    sourceSets.main.resources.srcDir(new File(era, 'resources'))
}
// The one copy of a file this band compiles, wherever it lives (src/main or one of its eras), or
// null. Used for the access widener and transformers, which the plugins want as a single path.
ext.bandFile = { File moduleDir, String rel ->
    ([new File(moduleDir, 'src/main')] + bandEraDirs(moduleDir))
            .collect { new File(it, rel) }.find { it.exists() }
}

repositories {
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'Shedaniel'          // Cloth Config
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'TerraformersMC'     // Mod Menu
        url = 'https://maven.terraformersmc.com/'
    }
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${project.name}:$version")
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

// One LICENSE for the whole repository, at its root (rootProject is this band folder).
sourcesJar {
    from(rootProject.file('../LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('../LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_minecraft_version_range': fabric_minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'cloth_config_version'         : cloth_config_version,
            'modmenu_version'              : modmenu_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_version_range'       : neoforge_version_range,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            "forge_version": forge_version,
            "forge_version_range": forge_version_range,
            "forge_loader_version_range": forge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version
    ]

    var jsonExpandProps = expandProps.collectEntries {
        // A single escaped backslash: Properties turns the "\n" in description= into a REAL newline,
        // which is illegal inside a JSON string. The template's '\\\\n' emits TWO backslashes and
        // shows a literal \n in the mod list. An invalid fabric.mod.json still loads in game but
        // stops Modrinth auto-detecting the loader and game versions on upload.
        key, value -> [(key): value instanceof String ? value.replace('\n', '\\n') : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url')
        }
    }
}
