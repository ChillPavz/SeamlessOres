# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=2.0.0
group=com.chillpavz.seamlessores
java_version=21

# Common
minecraft_version=1.21.11
mod_name=Seamless Ores
mod_author=chillpavz
mod_id=seamlessores
license=PolyForm-Shield-1.0.0
credits=
description=Ore blocks whose background matches the stone they generate in. \nVanilla ore distribution is preserved exactly.
## Maven bracket range - used by the NeoForge and Forge tomls. Fabric CANNOT parse this form, see below.
minecraft_version_range=[1.21.11, 1.22)
## Fabric semver equivalent of the above, for fabric.mod.json.
fabric_minecraft_version_range=>=1.21.11 <1.22
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.11-20251209.172050
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21.11
parchment_version=2025.12.20

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.139.5+1.21.11
fabric_loader_version=0.18.2

# Cloth Config (config screen), from https://maven.shedaniel.me/
# Mod id is 'cloth_config' and it PROVIDES 'cloth-config2' - so fabric.mod.json depends on
# cloth-config2 while the NeoForge toml depends on cloth_config. Getting that backwards fails to load.
# Cloth has NO Forge build past 1.21.3, so the Forge module uses Forge's own ForgeConfigSpec plus a
# hand-written screen instead.
cloth_config_version=21.11.153
# Mod Menu (Fabric-only config button), from https://maven.terraformersmc.com/
modmenu_version=17.0.0

# Forge, see https://files.minecraftforge.net/net/minecraftforge/forge/ for new versions
forge_version=61.0.1
## Accepted Forge builds. Same rule as neoforge_version_range - never "[${forge_version},)".
forge_version_range=[61,)
forge_loader_version_range=[61,)

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=21.11.3-beta
neoforge_loader_version_range=[4,)
## Range for the 'neoforge' MOD dependency. Must NOT be "[${neoforge_version},)" - NeoForge builds are
## numbered <mc>.<build>, so pinning to the build we compiled against rejects every earlier build of the
## same Minecraft version.
neoforge_version_range=[21.11, 21.12)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
