# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=2.0.0
group=com.chillpavz.seamlessores
java_version=21

# Common
minecraft_version=1.21.4
mod_name=Seamless Ores
mod_author=chillpavz
mod_id=seamlessores
license=PolyForm-Shield-1.0.0
credits=
description=Ore blocks whose background matches the stone they generate in. \nVanilla ore distribution is preserved exactly.
## ONE JAR FOR 1.21.4 THROUGH 1.21.10. Compiled against 1.21.4 (the oldest in the range) and
## declared back up to 1.21.10. Stops before 1.21.11, which renames ResourceLocation to Identifier
## on the loaders that run on official names (NeoForge/Forge), so a jar built here would not link
## there. Fabric and NeoForge only: classic Forge has a hard binary wall inside this range (eventbus
## 6 -> 7, FMLJavaModLoadingContext -> BusGroup, at 1.21.5/1.21.6), so one Forge jar cannot span it.
minecraft_version_range=[1.21.4, 1.21.11)
## Fabric semver equivalent of the above. Fabric CANNOT parse the Maven bracket form.
fabric_minecraft_version_range=>=1.21.4 <1.21.11
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.4-20241203.161809
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21.4
parchment_version=2024.12.22

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.119.4+1.21.4
fabric_loader_version=0.16.9

# Cloth Config (config screen), from https://maven.shedaniel.me/
# Mod id is 'cloth_config' and it PROVIDES 'cloth-config2' - so fabric.mod.json depends on
# cloth-config2 while the loader TOMLs depend on cloth_config. Getting that backwards fails to load.
# Cloth ships a different MAJOR per Minecraft version across this range (17.x is 1.21.4, 18.x 1.21.5,
# 19.x 1.21.6-8, 20.x 1.21.9-10), so the dependency range in neoforge.mods.toml is permissive
# upward - a user gets whichever build matches their Minecraft version.
cloth_config_version=17.0.144
# Mod Menu (Fabric-only config button), from https://maven.terraformersmc.com/
modmenu_version=13.0.4

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=21.4.157
neoforge_loader_version_range=[4,)
## Range for the 'neoforge' MOD dependency. 21.4 is 1.21.4, 21.10 is 1.21.10; 21.11 is 1.21.11 and
## crosses the Identifier rename, hence the upper bound.
neoforge_version_range=[21.4,21.11)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
