# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=2.0.0
group=com.chillpavz.seamlessores
## Mojang requires Java 17 at this Minecraft version, so the jar must be class-file major 61.
## NOTE this is NOT the JDK you build with: Gradle 8.11 plus ModDevGradle needs JDK 22.
java_version=17

# Common
minecraft_version=1.20.1
mod_name=Seamless Ores
mod_author=chillpavz
mod_id=seamlessores
license=PolyForm-Shield-1.0.0
credits=
description=Ore blocks whose background matches the stone they generate in. \nVanilla ore distribution is preserved exactly.
## ONE JAR FOR 1.20 AND 1.20.1. The upper bound MUST stop below 1.20.2, which rewrote networking and
## moved the data folders; the template's default of [1.20.1, 1.22) would let this install on 1.21.x.
minecraft_version_range=[1.20, 1.20.2)
## Fabric semver equivalent of the above. Fabric CANNOT parse the Maven bracket form.
fabric_minecraft_version_range=>=1.20 <1.20.2
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.92.1+1.20.1
fabric_loader_version=0.16.9

# Cloth Config (config screen), from https://maven.shedaniel.me/
# Mod id is 'cloth_config' and it PROVIDES 'cloth-config2' - so fabric.mod.json depends on
# cloth-config2 while the loader TOML depends on cloth_config. Getting that backwards fails to load.
# 11.1.136 ships one build per loader covering BOTH 1.20 and 1.20.1, on Fabric and Forge alike, so
# every loader gets the generated screen and no hand-written one is needed.
cloth_config_version=11.1.136
# Mod Menu (Fabric-only config button), from https://maven.terraformersmc.com/
modmenu_version=7.2.2

# Forge, see https://files.minecraftforge.net/net/minecraftforge/forge/ for new versions
# THERE IS NO SEPARATE NEOFORGE MODULE AT THIS VERSION. NeoForge 1.20.1 is 47.1.x, still on
# net.minecraftforge packages, and it PROVIDES the `forge` mod id - so this one Forge jar runs on
# both, and the Forge upload should be tagged for NeoForge as well.
forge_version=47.2.30
## Forge 46 is 1.20 and 47 is 1.20.1, so [46,48) is exactly this jar's two versions. Never
## "[${forge_version},)", which would refuse every build older than the one compiled against.
forge_version_range=[46,48)
forge_loader_version_range=[46,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
