# Important Notes:
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=2.0.0
group=com.chillpavz.seamlessores
java_version=25

# Common
minecraft_version=26.2
mod_name=Seamless Ores
mod_author=chillpavz
mod_id=seamlessores
license=PolyForm-Shield-1.0.0
credits=
description=Ore blocks whose background matches the stone they generate in. \nVanilla ore distribution is preserved exactly.
## Maven bracket range - used by the NeoForge toml. Fabric CANNOT parse this form, see below.
minecraft_version_range=[26.2, 26.3)
## Fabric semver equivalent of the above, for fabric.mod.json.
fabric_minecraft_version_range=>=26.2 <26.3
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.152.1+26.2
fabric_loader_version=0.19.3

# Cloth Config (config screen), from https://maven.shedaniel.me/
# Mod id is 'cloth_config' and it PROVIDES 'cloth-config2' - so fabric.mod.json depends on
# cloth-config2 while the NeoForge toml depends on cloth_config. Getting that backwards fails to load.
cloth_config_version=26.2.155
# Mod Menu (Fabric-only config button), from https://maven.terraformersmc.com/
modmenu_version=20.0.1

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.2.0.1-beta
neoforge_loader_version_range=[4,)
## Range for the 'neoforge' MOD dependency. Must NOT be "[${neoforge_version},)" - NeoForge builds are
## numbered <mc>.<build>, so pinning to the build we compiled against rejects every earlier build of the
## same Minecraft version.
neoforge_version_range=[26.2, 26.3)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
