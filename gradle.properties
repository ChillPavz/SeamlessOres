# Important Notes:
# Every field you add must be added to build-logic/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=4.5.0
group=com.chillpavz.seamlessores
java_version=25

# Common
mod_name=Seamless Ores
mod_author=chillpavz
mod_id=seamlessores
license=PolyForm-Shield-1.0.0
credits=
description=Ore blocks whose background matches the stone they generate in. \nVanilla ore distribution is preserved exactly.
# Cloth Config's mod id is 'cloth_config' and it PROVIDES 'cloth-config2' - so fabric.mod.json depends on
# cloth-config2 while the NeoForge toml depends on cloth_config. Getting that backwards fails to load.
neoforge_loader_version_range=[4,)

# Minecraft band. Everything that changes with the Minecraft version (Minecraft, NeoForm, Fabric, Cloth,
# Mod Menu, NeoForge, and which era source set is compiled) lives in versions/<band>.properties, which
# settings.gradle loads. Build another band with -Pmc=26.2 or -Pmc=26.1.x.
mc=26.3

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
