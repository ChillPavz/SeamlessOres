# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=2.0.0
group=com.chillpavz.seamlessores
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Seamless Ores
mod_author=chillpavz
mod_id=seamlessores
license=PolyForm-Shield-1.0.0
credits=
description=Ore blocks whose background matches the stone they generate in. \nVanilla ore distribution is preserved exactly.
## ONE JAR FOR 1.21 AND 1.21.1. Compiled against 1.21.1 and declared back to 1.21, the same trade
## Ore Detector Reborn shipped on. Stops before 1.21.2, which is a different era: NeoForge 21.2 and
## Forge 53 are a new API generation, and the assets/<ns>/items/ model layer arrives at 1.21.4.
minecraft_version_range=[1.21, 1.21.2)
## Fabric semver equivalent of the above. Fabric CANNOT parse the Maven bracket form.
fabric_minecraft_version_range=>=1.21 <1.21.2
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.109.0+1.21.1
fabric_loader_version=0.16.9

# Cloth Config (config screen), from https://maven.shedaniel.me/
# Mod id is 'cloth_config' and it PROVIDES 'cloth-config2' - so fabric.mod.json depends on
# cloth-config2 while the loader TOMLs depend on cloth_config. Getting that backwards fails to load.
# UNLIKE 1.21.11, cloth HAS a Forge build at this version, so all three loaders get a generated
# screen and no hand-written one is needed.
cloth_config_version=15.0.140
# Mod Menu (Fabric-only config button), from https://maven.terraformersmc.com/
modmenu_version=11.0.4

# Forge, see https://files.minecraftforge.net/net/minecraftforge/forge/ for new versions
forge_version=52.0.28
## Accepted Forge builds: 51 is 1.21, 52 is 1.21.1. Never "[${forge_version},)".
forge_version_range=[51,53)
forge_loader_version_range=[51,)

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=21.1.80
neoforge_loader_version_range=[4,)
## Range for the 'neoforge' MOD dependency. 21.0 is 1.21, 21.1 is 1.21.1; 21.2 is 1.21.2 and is a
## different API generation, hence the upper bound.
neoforge_version_range=[21.0,21.2)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
