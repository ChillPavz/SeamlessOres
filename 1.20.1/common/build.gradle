plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    mcpVersion = minecraft_version
    // Use accessTransformers.from(...), NOT "accessTransformers = [...]". The assignment form was
    // inherited from a project that has no access transformer, so it was never exercised there; it
    // configures nothing, and the symptom is not a build error but an ordinary compile failure like
    // "bindValue(T) is not public in Reference", i.e. exactly what an AT that matched nothing would
    // look like. Confirmed by javap on the produced jar: bindValue stayed package-private.
    validateAccessTransformers = true

    def at = file("src/main/resources/META-INF/accesstransformer.cfg")
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    // The dripstone shell mixin. Fabric and Forge both bundle Mixin at runtime.
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

// Code and resources that are identical in every band live once, in the repository's shared/
// folder; every loader takes them alongside this module's own. One artifact per folder: the
// template's sourceDirectories.singleFile throws once there are two.
sourceSets.main.java.srcDir('../../shared/java')
sourceSets.main.resources.srcDir('../../shared/resources')

artifacts {
    sourceSets.main.java.srcDirs.each { commonJava it }
    sourceSets.main.resources.srcDirs.each { commonResources it }
}

// The ore overlays, from shared/textures: only those this band's models name.
apply from: '../../shared/gradle/texture-pool.gradle'
