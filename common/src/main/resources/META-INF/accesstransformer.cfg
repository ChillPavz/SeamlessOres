# Holder.Reference#bindValue is protected. We need it to swap the value of an already-loaded
# CONFIGURED_FEATURE entry, which is how the ore target injection works - see OreTargetInjector.
# Rebinding the holder is preferred over mutating OreConfiguration.targetStates, which is a final
# field holding an immutable list decoded by a Codec.
public net.minecraft.core.Holder$Reference bindValue(Ljava/lang/Object;)V

# RegistrySetBuilder$LazyHolder is the only subclass that overrides it, and a protected override of
# a public method is illegal - widening only the parent fails the Minecraft recompile with
#   bindValue(T) in net.minecraft.core.RegistrySetBuilder.LazyHolder cannot override
#   bindValue(T) in net.minecraft.core.Holder.Reference
# On Fabric the same mismatch would instead be an IllegalAccessError at class load.
public net.minecraft.core.RegistrySetBuilder$LazyHolder bindValue(Ljava/lang/Object;)V

# OreVeinifier.VeinType holds the ore block for the large copper/iron veins, which are built during
# NOISE generation rather than by a configured feature - the registry injection cannot reach them.
# See VeinOreInjector. '-f' strips final so the field can be reassigned.
public net.minecraft.world.level.levelgen.OreVeinifier$VeinType
public-f net.minecraft.world.level.levelgen.OreVeinifier$VeinType ore

# CountPlacement.count holds how many times a placed feature is attempted per chunk. It is private,
# and reading it is the only way to SCALE a count rather than overwrite it with a guessed number -
# which matters because a datapack may already have changed vanilla's value. See
# CopperDensityInjector. NeoForge takes plain names here; the forge module needs its own SRG copy.
public net.minecraft.world.level.levelgen.placement.CountPlacement count # count
