# Access transformer for BOTH modules on this branch: common applies it, and forge/build.gradle
# points at this same file. There is no second copy, unlike the 1.21.11 branch.
#
# MEMBER NAMES MUST BE SRG HERE (m_247654_, f_209676_); CLASS names stay official. ModDevGradle's
# legacyForge applies the transform to the SRG-named jar, exactly as ForgeGradle does, even though
# the code you write is in official Mojang names. Plain member names resolve to nothing.
#
# THE GOOD NEWS is that this fails LOUDLY here, unlike ForgeGradle. With
# validateAccessTransformers = true (set in common/build.gradle) the build prints, per entry:
#   Access transformer PUBLIC LEAVE <file>:<line>, targeting net.minecraft.core.Holder$Reference
#   METHOD bindValue(Ljava/lang/Object;)V did not apply as its target doesn't exist
# Without that flag the symptom is an ordinary compile error - "bindValue(T) is not public in
# Reference" - which looks like a source problem rather than a build-configuration one. Keep the
# flag on.
#
# Recover an SRG name from common/build/moddev/artifacts/namedToIntermediate.tsrg after any build:
# classes are listed by their official name, and each member line reads "<named> <descriptor> <srg>"
# for a method or "<named> <srg>" for a field. Re-derive on every version bump; these numbers are
# not stable across Minecraft versions in general, though 1.20.1, 1.21.1 and 1.21.11 happen to
# agree on both of the ones below (checked against the mapping file, not assumed).
#
# Keep the SET of widenings in sync with common/src/main/resources/seamlessores.accesswidener,
# which is Fabric's equivalent and uses PLAIN names in the 'named' namespace.

# Holder.Reference#bindValue is protected. We need it to swap the value of an already-loaded
# CONFIGURED_FEATURE entry, which is how the ore target injection works - see OreTargetInjector.
# Rebinding the holder is preferred over mutating OreConfiguration.targetStates, which is a final
# field holding an immutable list decoded by a Codec.
#
# NOTE there is no companion entry for a subclass here. The newer branches must also widen
# RegistrySetBuilder$LazyHolder, because a protected override of a now-public method is illegal -
# but that class does not exist at 1.20.1, and nothing else in the jar overrides bindValue
# (checked). Adding it would itself fail validation as a target that does not exist.
public net.minecraft.core.Holder$Reference m_247654_(Ljava/lang/Object;)V # bindValue

# OreVeinifier.VeinType holds the ore block for the large copper/iron veins, which are built during
# NOISE generation rather than by a configured feature - the registry injection cannot reach them.
# See VeinOreInjector. '-f' strips final so the field can be reassigned.
public net.minecraft.world.level.levelgen.OreVeinifier$VeinType
public-f net.minecraft.world.level.levelgen.OreVeinifier$VeinType f_209676_ # ore
