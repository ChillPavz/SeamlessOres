plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    mcpVersion = minecraft_version
    // Use accessTransformers.from(...), NOT "accessTransformers = [...]". The assignment form was
    // inherited from a project that has no access transformer, so it was never exercised there; it
    // configures nothing, and the symptom is not a build error but an ordinary compile failure like
    // "bindValue(T) is not public in Reference", i.e. exactly what an AT that matched nothing would
    // look like. Confirmed by javap on the produced jar: bindValue stayed package-private.
    validateAccessTransformers = true

    def at = file("src/main/resources/META-INF/accesstransformer.cfg")
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
